<!DOCTYPE html>
<html lang="en" data-lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.summary %}{{ page.summary }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="author" content="{{ site.author }}">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="google6f8fbb64d5319944" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta property="og:description" content="{% if page.summary %}{{ page.summary }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta name="twitter:description" content="{% if page.summary %}{{ page.summary }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "{{ site.title }}",
      "url": "{{ site.url }}",
      "description": "{{ site.description }}",
      "author": {
        "@type": "Person",
        "name": "{{ site.author }}",
        "url": "{{ site.url }}/about/",
        "sameAs": [
          "https://github.com/{{ site.github_username }}"
        ]
      }
    }
    </script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>

<body>
    <!-- 1. Sticky Navigation Bar -->
    <nav class="top-nav">
        <div class="container nav-container">
            <a href="{{ '/' | relative_url }}" class="nav-logo">
                GUOBUG.DESIGN
                <span class="nav-logo-badge">SYSTEM</span>
            </a>

            <div class="nav-links">
                <a href="{{ '/#vibe' | relative_url }}" class="nav-link">
                    <span>VIBE CODING</span>
                </a>
                <a href="{{ '/posts/' | relative_url }}" class="nav-link {% if page.url contains '/posts' %}active-nav{% endif %}">
                    <span data-i18n="zh">文章</span>
                    <span data-i18n="en">WRITINGS</span>
                </a>
                <a href="{{ '/about/' | relative_url }}" class="nav-link {% if page.url contains '/about' %}active-nav{% endif %}">
                    <span data-i18n="zh">关于我</span>
                    <span data-i18n="en">ABOUT ME</span>
                </a>
            </div>

            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <!-- Language Switcher -->
                <div class="lang-switch">
                    <button type="button" class="lang-btn" data-lang-btn="zh">中文</button>
                    <span>/</span>
                    <button type="button" class="lang-btn active" data-lang-btn="en">EN</button>
                </div>

                <!-- Mobile Menu Button -->
                <button type="button" class="menu-toggle-btn" id="menuToggleBtn" aria-label="Toggle menu">[MENU]</button>
            </div>
        </div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="mobile-nav-drawer" id="mobileNavDrawer">
        <ul class="mobile-nav-list">
            <li><a href="{{ '/#vibe' | relative_url }}">VIBE CODING</a></li>
            <li><a href="{{ '/posts/' | relative_url }}"><span data-i18n="zh">文章</span><span data-i18n="en">WRITINGS</span></a></li>
            <li><a href="{{ '/about/' | relative_url }}"><span data-i18n="zh">关于我</span><span data-i18n="en">ABOUT ME</span></a></li>
        </ul>
    </div>

    <!-- Main Content Container -->
    <main class="section-block" style="border-bottom: none; min-height: 70vh; padding-top: 3.5rem;">
        <div class="container">
            {{ content }}
        </div>
    </main>

    <!-- Dark Inverted Footer -->
    <footer class="site-footer" style="padding-top: 3.5rem; padding-bottom: 3.5rem;">
        <div class="footer-dot-bg"></div>
        <div class="container" style="position: relative; z-index: 10;">
            <div class="footer-bottom" style="margin-top: 0; padding-top: 0; border-top: none;">
                <div>
                    © 2026 Gu0 Qiang / GuoBug · Built with Vibe Coding
                </div>
                <div class="footer-social-links">
                    <a href="https://github.com/GuoBug" target="_blank" rel="noopener noreferrer" class="footer-social-link">GITHUB</a>
                    <a href="https://guobug.github.io/metaphysics-tools/index.html#" target="_blank" rel="noopener noreferrer" class="footer-social-link">METAPHYSICS</a>
                    <a href="mailto:gu0bug0@gmail.com" class="footer-social-link">CONTACT</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Client Script -->
    <script src="{{ '/assets/app.js' | relative_url }}"></script>
</body>

</html>
