---
layout: default
---
<span class="c-magenta">#</span> <span class="c-green">{{ page.title }}</span>

{{ content }}

<span class="c-dim">--------------------------------------------------</span>
<ul style="list-style: none; padding: 0;">
{% for post in site.posts %}
  <li style="margin-bottom: 1em;">
    <span class="c-dim">[{{ post.date | date: "%Y-%m-%d" }}]</span> 
    <a href="{{ post.url | relative_url }}" class="c-cyan">{{ post.title }}</a>
    <br>
    <span class="c-dim">{{ post.summary | default: post.excerpt | strip_html | truncatewords: 20 }}</span>
  </li>
{% endfor %}
</ul>
