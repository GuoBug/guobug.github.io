<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" style="background: transparent; display: block;">
  <defs>
    <!-- Background Dot Grid -->
    <pattern id="dot-grid-community" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#D4D4D8" />
    </pattern>

    <!-- Marker Arrowheads -->
    <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF4D4D" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" stroke="#000000" stroke-width="1.5"/>
    </marker>

    <style>
      .font-mono { font-family: 'Space Mono', SFMono-Regular, Menlo, Monaco, Consolas, 'PingFang SC', monospace; }
      .font-heading { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif; }
      .bold { font-weight: 700; }
      .border-main { stroke: #000000; stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; }
      .border-card { stroke: #000000; stroke-width: 2; }
      .border-thin { stroke: #000000; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- ================= Outer Container ================= -->
  <rect x="14" y="14" width="932" height="412" rx="6" fill="#000000" />
  <rect x="10" y="10" width="932" height="412" rx="6" fill="#FAF9F5" class="border-main" />
  <rect x="13" y="13" width="926" height="406" rx="4" fill="url(#dot-grid-community)" />

  <!-- ================= Header Bar ================= -->
  <rect x="26" y="24" width="900" height="42" rx="4" fill="#000000" />
  <rect x="23" y="21" width="900" height="42" rx="4" fill="#FFFFFF" class="border-card" />

  <rect x="32" y="29" width="180" height="26" rx="3" fill="#A3E635" class="border-thin" />
  <text x="122" y="46" class="font-mono bold" font-size="10.5" fill="#000000" text-anchor="middle" letter-spacing="1">GOVERNANCE TAXONOMY</text>

  <text x="224" y="47" class="font-heading bold" font-size="13.5" fill="#000000" letter-spacing="0.5">COMMUNITY EVOLUTION: PEACEMAKER TRAP VS. PHYSICAL MECHANISM</text>
  <text x="760" y="47" class="font-mono" font-size="10" fill="#52525B">SYSTEM DYNAMICS</text>

  <!-- ================= Column 1: Cold Start ================= -->
  <rect x="33" y="88" width="260" height="318" rx="5" fill="#000000" />
  <rect x="30" y="85" width="260" height="318" rx="5" fill="#FFFFFF" class="border-card" />

  <rect x="42" y="97" width="165" height="22" rx="3" fill="#F4F4F5" class="border-thin" />
  <text x="124" y="112" class="font-mono bold" font-size="9.5" fill="#000000" text-anchor="middle">PHASE 01 · 假性共识</text>

  <text x="42" y="145" class="font-heading bold" font-size="13.5" fill="#000000">冷启动的默契幻觉</text>
  <text x="42" y="165" class="font-mono" font-size="9.5" fill="#71717A">高度同质化圈层的脆弱平衡</text>

  <rect x="42" y="185" width="236" height="115" rx="3" fill="#F0FDF4" class="border-thin" />
  <text x="52" y="207" class="font-mono bold" font-size="9" fill="#15803D">• 核心用户背景高度同质</text>
  <text x="52" y="227" class="font-mono bold" font-size="9" fill="#15803D">• 依靠未成文道德自觉维持</text>
  <text x="52" y="247" class="font-mono" font-size="8.5" fill="#71717A">• 零物理约束的空白输入框</text>
  <text x="52" y="265" class="font-mono" font-size="8.5" fill="#71717A">• 误以为高信噪比可自发生长</text>
  <text x="52" y="285" class="font-mono bold" font-size="8.5" fill="#047857">暂无真实冲突考验</text>

  <rect x="42" y="318" width="236" height="66" rx="3" fill="#F4F4F5" class="border-thin" />
  <text x="52" y="340" class="font-mono bold" font-size="8.5" fill="#18181B">治理盲点：</text>
  <text x="52" y="358" class="font-mono" font-size="8.5" fill="#52525B">误把冷启动的同温层红利</text>
  <text x="52" y="374" class="font-mono" font-size="8.5" fill="#52525B">当成持久的社区壁垒</text>

  <!-- Connection Arrow 1 -> 2 -->
  <line x1="290" y1="244" x2="330" y2="244" stroke="#000000" stroke-width="2.5" marker-end="url(#arrow-black)" />

  <!-- ================= Column 2: Friction & Imbalance ================= -->
  <rect x="343" y="88" width="260" height="318" rx="5" fill="#000000" />
  <rect x="340" y="85" width="260" height="318" rx="5" fill="#FFFFFF" class="border-card" />

  <rect x="352" y="97" width="165" height="22" rx="3" fill="#FFFBEB" class="border-thin" />
  <text x="434" y="112" class="font-mono bold" font-size="9.5" fill="#000000" text-anchor="middle">PHASE 02 · 交互倾轧</text>

  <text x="352" y="145" class="font-heading bold" font-size="13.5" fill="#000000">输入失衡与好恶分化</text>
  <text x="352" y="165" class="font-mono" font-size="9.5" fill="#71717A">无阻力输入带来的信息摩擦</text>

  <rect x="352" y="185" width="236" height="115" rx="3" fill="#FFF7ED" class="border-thin" />
  <text x="362" y="207" class="font-mono bold" font-size="9" fill="#C2410C">• 10 页 A4 纸小作文倾轧短对话</text>
  <text x="362" y="227" class="font-mono bold" font-size="9" fill="#C2410C">• 敏感型内向个体（I人）窒息撤退</text>
  <text x="362" y="247" class="font-mono" font-size="8.5" fill="#71717A">• 功利心驱动最低阻力：无节制复制</text>
  <text x="362" y="265" class="font-mono" font-size="8.5" fill="#71717A">• 鸡毛蒜皮的小观点摩擦日常化</text>
  <text x="362" y="285" class="font-mono bold" font-size="8.5" fill="#EA580C">底层好恶撕裂表层共识</text>

  <rect x="352" y="318" width="236" height="66" rx="3" fill="#F4F4F5" class="border-thin" />
  <text x="362" y="340" class="font-mono bold" font-size="8.5" fill="#18181B">逼问核心逻辑：</text>
  <text x="362" y="358" class="font-mono" font-size="8.5" fill="#52525B">这个场域到底在保护什么？</text>
  <text x="362" y="374" class="font-mono" font-size="8.5" fill="#52525B">谁与谁终究无法共处？</text>

  <!-- Connection Divergence Arrows -->
  <path d="M 600 210 L 625 210 L 625 160 L 650 160" fill="none" stroke="#FF4D4D" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <path d="M 600 270 L 625 270 L 625 320 L 650 320" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)" />

  <!-- ================= Column 3: The Divergence ================= -->
  <!-- Option A: Peacemaker Trap -->
  <rect x="653" y="88" width="260" height="150" rx="5" fill="#000000" />
  <rect x="650" y="85" width="260" height="150" rx="5" fill="#FFFFFF" class="border-card" />

  <rect x="662" y="97" width="145" height="20" rx="3" fill="#FEE2E2" class="border-thin" />
  <text x="734" y="111" class="font-mono bold" font-size="9" fill="#DC2626" text-anchor="middle">ROUTE A · 和事佬陷阱</text>

  <text x="662" y="136" class="font-heading bold" font-size="12" fill="#000000">两头讨好与平庸空心化</text>
  <text x="662" y="156" class="font-mono" font-size="8.5" fill="#52525B">• 试图兼顾所有群体习惯</text>
  <text x="662" y="174" class="font-mono" font-size="8.5" fill="#52525B">• 老用户疲惫，新用户内耗</text>
  <text x="662" y="192" class="font-mono bold" font-size="8.5" fill="#DC2626">• 终局：不欢而散，沦为死寂空壳</text>
  <rect x="662" y="206" width="236" height="20" rx="2" fill="#FEF2F2" />
  <text x="670" y="220" class="font-mono bold" font-size="8.5" fill="#991B1B">COST: 丧失辨识度与灵魂</text>

  <!-- Option B: Deterministic Physical Constraints -->
  <rect x="653" y="256" width="260" height="150" rx="5" fill="#000000" />
  <rect x="650" y="253" width="260" height="150" rx="5" fill="#FFFFFF" class="border-card" />

  <rect x="662" y="265" width="155" height="20" rx="3" fill="#DCFCE7" class="border-thin" />
  <text x="739" y="279" class="font-mono bold" font-size="9" fill="#15803D" text-anchor="middle">ROUTE B · 确定性物理约束</text>

  <text x="662" y="304" class="font-heading bold" font-size="12" fill="#000000">输入硬截断与 PoW 凭证</text>
  <text x="662" y="324" class="font-mono" font-size="8.5" fill="#52525B">• 卡片多大，输入端限制多严</text>
  <text x="662" y="342" class="font-mono" font-size="8.5" fill="#52525B">• 客观事实凭证替代主观叙事</text>
  <text x="662" y="360" class="font-mono bold" font-size="8.5" fill="#15803D">• 终局：给气味相投者守住自留地</text>
  <rect x="662" y="374" width="236" height="20" rx="2" fill="#F0FDF4" />
  <text x="670" y="388" class="font-mono bold" font-size="8.5" fill="#166534">TRADE-OFF: 牺牲表层泛流量</text>
</svg>
