<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" style="background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="intakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="releaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Frame Background -->
  <rect x="16" y="16" width="928" height="548" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#box-shadow)"/>

  <!-- Header Section -->
  <text x="40" y="52" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">GITLAB CN PRODUCT PLANNING WORKFLOW ARCHITECTURE</text>
  <text x="40" y="74" fill="#94a3b8" font-size="12">Multi-Source Intake, 4-Quadrant Priority Matrix, Scope Freeze &amp; Deterministic Release Train</text>
  <line x1="40" y1="88" x2="920" y2="88" stroke="#1e293b" stroke-width="2"/>

  <!-- Column 1: Multi-Source Intake & Contract (X: 40 to 290) -->
  <g transform="translate(40, 104)">
    <rect x="0" y="0" width="250" height="434" rx="8" fill="url(#intakeGrad)" stroke="#4338ca" stroke-width="1.5"/>
    <rect x="12" y="12" width="130" height="22" rx="4" fill="#3730a3"/>
    <text x="20" y="27" fill="#e0e7ff" font-size="10" font-weight="700">1. MULTI-SOURCE INTAKE</text>

    <!-- Source Items -->
    <rect x="12" y="44" width="226" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="22" y="62" fill="#38bdf8" font-size="11" font-weight="700">Sales &amp; Customer Success</text>
    <text x="22" y="78" fill="#94a3b8" font-size="10">~"Team::Sales" / ~"Team::CS"</text>
    <text x="22" y="90" fill="#f43f5e" font-size="9" font-weight="600">~"CREQ::blocker / high / low"</text>

    <rect x="12" y="104" width="226" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="22" y="122" fill="#a78bfa" font-size="11" font-weight="700">Presales &amp; Strategic Partners</text>
    <text x="22" y="138" fill="#94a3b8" font-size="10">~"Team::Presales" | Strategic Alliances</text>
    <text x="22" y="150" fill="#cbd5e1" font-size="9">CN Partner Integration Proposal</text>

    <rect x="12" y="164" width="226" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="22" y="182" fill="#34d399" font-size="11" font-weight="700">Community &amp; Internal Insights</text>
    <text x="22" y="198" fill="#94a3b8" font-size="10">~"insight" | Community Forum</text>
    <text x="22" y="210" fill="#cbd5e1" font-size="9">CN Feature Proposal (Lean / Detailed)</text>

    <!-- Label State Machine Box -->
    <rect x="12" y="226" width="226" height="194" rx="6" fill="#0b0f19" stroke="#6366f1" stroke-width="1.2"/>
    <text x="22" y="246" fill="#818cf8" font-size="11" font-weight="700">Labels as State Machine</text>
    
    <text x="22" y="268" fill="#cbd5e1" font-size="10">● Type Protocol:</text>
    <text x="32" y="284" fill="#94a3b8" font-size="9">type::bug | type::feature | type::maintenance</text>

    <text x="22" y="306" fill="#cbd5e1" font-size="10">● Escalation Handling:</text>
    <text x="32" y="322" fill="#ef4444" font-size="9">~"Escalation" + Mandatory Sync Log</text>

    <text x="22" y="344" fill="#cbd5e1" font-size="10">● Contract Rule:</text>
    <text x="32" y="360" fill="#fbbf24" font-size="9">Zero Private-Chat Demands</text>
    <text x="32" y="374" fill="#94a3b8" font-size="9">All discussions strictly on GitLab Issue</text>
    <text x="32" y="398" fill="#10b981" font-size="9" font-weight="600">SLA: 1-Week Response Guarantee</text>
  </g>

  <!-- Arrow Intake -> Matrix -->
  <line x1="290" y1="320" x2="318" y2="320" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Column 2: Value vs Complexity Decision Matrix (X: 320 to 630) -->
  <g transform="translate(320, 104)">
    <rect x="0" y="0" width="310" height="434" rx="8" fill="url(#matrixGrad)" stroke="#059669" stroke-width="1.5"/>
    <rect x="12" y="12" width="165" height="22" rx="4" fill="#065f46"/>
    <text x="20" y="27" fill="#d1fae5" font-size="10" font-weight="700">2. VALUE-COMPLEXITY MATRIX</text>

    <!-- 4 Evaluation Pillars -->
    <rect x="12" y="44" width="286" height="44" rx="6" fill="#134e4a" stroke="#0d9488" stroke-width="1"/>
    <text x="20" y="60" fill="#a7f3d0" font-size="10" font-weight="700">4-Way Evaluation Protocol</text>
    <text x="20" y="76" fill="#ccfbf1" font-size="9">PM: Value &amp; Business Viability | UX: Usability | Eng: Feasibility</text>

    <!-- 2x2 Matrix Grid -->
    <g transform="translate(12, 98)">
      <!-- Quadrant 1: High Value, Low Complexity -->
      <rect x="0" y="0" width="138" height="155" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="6" y="6" width="70" height="18" rx="3" fill="#047857"/>
      <text x="10" y="19" fill="#ecfdf5" font-size="9" font-weight="700">QUADRANT 1</text>
      <text x="8" y="42" fill="#34d399" font-size="11" font-weight="700">High Value / Low Cmplx</text>
      <text x="8" y="62" fill="#d1fae5" font-size="9">● Quick Wins</text>
      <text x="8" y="78" fill="#d1fae5" font-size="9">● Direct Milestone Priority</text>
      <text x="8" y="94" fill="#d1fae5" font-size="9">● Rapid Commercial Value</text>
      <text x="8" y="138" fill="#a7f3d0" font-size="9" font-weight="700">ACTION: SHIP FIRST</text>

      <!-- Quadrant 2: High Value, High Complexity -->
      <rect x="148" y="0" width="138" height="155" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="154" y="6" width="70" height="18" rx="3" fill="#b45309"/>
      <text x="158" y="19" fill="#fef3c7" font-size="9" font-weight="700">QUADRANT 2</text>
      <text x="156" y="42" fill="#fbbf24" font-size="11" font-weight="700">High Value / High Cmplx</text>
      <text x="156" y="62" fill="#cbd5e1" font-size="9">● Strategic Epics</text>
      <text x="156" y="78" fill="#cbd5e1" font-size="9">● Slice into Iterative Issues</text>
      <text x="156" y="94" fill="#cbd5e1" font-size="9">● Multi-Sprint Runway</text>
      <text x="156" y="138" fill="#fde68a" font-size="9" font-weight="700">ACTION: DECOMPOSE</text>

      <!-- Quadrant 3: Low Value, Low Complexity -->
      <rect x="0" y="165" width="138" height="155" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <rect x="6" y="171" width="70" height="18" rx="3" fill="#334155"/>
      <text x="10" y="184" fill="#cbd5e1" font-size="9" font-weight="700">QUADRANT 3</text>
      <text x="8" y="206" fill="#94a3b8" font-size="11" font-weight="700">Low Value / Low Cmplx</text>
      <text x="8" y="226" fill="#64748b" font-size="9">● Small Convenience</text>
      <text x="8" y="242" fill="#64748b" font-size="9">● Backlog Fillers</text>
      <text x="8" y="258" fill="#64748b" font-size="9">● Dev Interest Claiming</text>
      <text x="8" y="302" fill="#94a3b8" font-size="9" font-weight="700">ACTION: SHIP IF IDLE</text>

      <!-- Quadrant 4: Low Value, High Complexity -->
      <rect x="148" y="165" width="138" height="155" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1.2"/>
      <rect x="154" y="171" width="70" height="18" rx="3" fill="#991b1b"/>
      <text x="158" y="184" fill="#fecaca" font-size="9" font-weight="700">QUADRANT 4</text>
      <text x="156" y="206" fill="#f87171" font-size="11" font-weight="700">Low Value / High Cmplx</text>
      <text x="156" y="226" fill="#fca5a5" font-size="9">● Costly Traps</text>
      <text x="156" y="242" fill="#fca5a5" font-size="9">● Technical Debt Sink</text>
      <text x="156" y="258" fill="#fca5a5" font-size="9">● Zero Release ROI</text>
      <text x="156" y="302" fill="#f87171" font-size="9" font-weight="700">ACTION: CLOSE &amp; DROP</text>
    </g>
  </g>

  <!-- Arrow Matrix -> Release -->
  <line x1="630" y1="320" x2="658" y2="320" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Column 3: 3-Version Backlog & Release Train (X: 660 to 920) -->
  <g transform="translate(660, 104)">
    <rect x="0" y="0" width="260" height="434" rx="8" fill="url(#releaseGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="12" y="12" width="170" height="22" rx="4" fill="#4338ca"/>
    <text x="20" y="27" fill="#e0e7ff" font-size="10" font-weight="700">3. MILESTONE &amp; RELEASE TRAIN</text>

    <!-- 3-Version Rolling Backlog -->
    <rect x="12" y="44" width="236" height="78" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
    <text x="22" y="62" fill="#818cf8" font-size="11" font-weight="700">3-Version Rolling Backlog</text>
    <text x="22" y="78" fill="#cbd5e1" font-size="10">Upcoming Milestones: M, M+1, M+2</text>
    <text x="22" y="94" fill="#94a3b8" font-size="9">Ahead-of-time planning for upstream</text>
    <text x="22" y="108" fill="#a5b4fc" font-size="9">GitLab Inc. MR review runway</text>

    <!-- Milestone Planning Schedule -->
    <rect x="12" y="132" width="236" height="88" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="22" y="150" fill="#38bdf8" font-size="11" font-weight="700">M-2 Milestone Planning</text>
    <text x="22" y="168" fill="#cbd5e1" font-size="9">● PM &amp; UX finalize user story &amp; design</text>
    <text x="22" y="184" fill="#cbd5e1" font-size="9">● Assigned Eng conducts tech feasibility</text>
    <text x="22" y="200" fill="#38bdf8" font-size="9">● Tasks estimation &amp; boundary breakdown</text>

    <!-- Scope Freeze Gateway -->
    <rect x="12" y="230" width="236" height="88" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="22" y="248" fill="#fbbf24" font-size="11" font-weight="700">M-1 Gate: Scope Freeze</text>
    <text x="22" y="266" fill="#fde68a" font-size="9">1 week before Milestone sprint starts:</text>
    <text x="22" y="282" fill="#cbd5e1" font-size="9">● Strict scope lock (zero major mutations)</text>
    <text x="22" y="298" fill="#ef4444" font-size="9" font-weight="600">● Eliminate downstream sprint thrashing</text>

    <!-- Release Cadence -->
    <rect x="12" y="328" width="236" height="92" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="22" y="346" fill="#34d399" font-size="11" font-weight="700">M: Deterministic Release Cadence</text>
    <text x="22" y="364" fill="#cbd5e1" font-size="9">● Dev self-picks backlog by interest</text>
    <text x="22" y="380" fill="#a7f3d0" font-size="9">● Monthly Cadence aligned with Upstream</text>
    <text x="22" y="396" fill="#fef08a" font-size="9" font-weight="600">● GitLab CN Ships +1 Week (QA &amp; Pack)</text>
    <text x="22" y="410" fill="#94a3b8" font-size="9">● Post-Sprint Retrospective doc closed</text>
  </g>
</svg>