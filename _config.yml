# 站点全局配置文件
# 修改这里的设置后，全站所有页面会自动生效

title: "Guo Qiang · Product Engineer · Workspace"
description: "Digital workspace of Guo Qiang. Senior Product Engineer blending platform engineering with growth mechanics, AI workflow orchestration, and deterministic architectures."
author: "Guo Qiang"
github_username: "GuoBug"
url: "https://guobug.github.io" # 在这里填入你的实际 GitHub Pages 地址 (如 https://username.github.io)
baseurl: "" # 如果你的仓库名不是 username.github.io 而是具体的项目名，如 /webpage，请在这里填 "/webpage"
email: "gu0bug0@gmail.com"

markdown: kramdown
permalink: /posts/:year/:month/:day/:title/
future: true
timezone: Asia/Shanghai

# 排除目录：避免历史废弃文件与本地预览文件被 Jekyll 误编译或抢占主站路由
exclude:
  - history
  - preview
  - devto
  - README.md
  - README_zh.md

# 使用到的插件，GitHub Pages 原生支持
plugins:
  - jekyll-seo-tag

